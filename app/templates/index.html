<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adrobot Campaign Manager</title><link rel="stylesheet" href="/static/style.css"></head><body><main><header><div><p class="eyebrow">ADROBOT / KEITARO</p><h1>Кампании</h1></div><span class="badge">Campaign manager</span></header><section class="panel"><h2>Создать кампанию</h2><form id="create"><label>Название<input name="name" required placeholder="test_pochtarev_campaign1"></label><label>Гео-код<input name="country" required maxlength="2" pattern="[A-Za-z]{2}" placeholder="DE"></label><label>Оффер<select name="offer_id" required><option value="">Загрузка…</option></select></label><label>Домен<select name="domain_id" required><option value="">Загрузка…</option></select></label><label>Группа кампаний<select name="group_id" required><option value="">Загрузка…</option></select></label><label>Источник трафика<select name="traffic_source_id" required><option value="">Загрузка…</option></select></label><button>Создать кампанию</button></form><p id="notice"></p></section><section class="panel"><div class="section-title"><h2>Редактор офферов</h2><button class="secondary" onclick="loadCampaigns()">Обновить</button></div><label>Кампания Keitaro<select id="campaign-picker"><option value="">Загрузка…</option></select></label><div id="editor" class="editor"></div></section><footer>Keitaro · <a href="/docs">API документация</a></footer></main><script src="/static/app.js"></script></body></html>
